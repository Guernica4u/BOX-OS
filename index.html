  CMDS.mv = function(a){
    if (a.length < 2) return err("mv: needs a source and a destination");
    const dest = absPath(a[a.length - 1], cwd);
    const srcs = a.slice(0, -1).map(x => absPath(x, cwd));
    const destNode = node(dest);
    if (srcs.length > 1 && (!destNode || destNode.type !== "dir"))
      return err("mv: " + a[a.length - 1] + ": not a directory");
    for (const src of srcs){
      if (!node(src)){ err("mv: " + tilde(src) + ": no such file or directory"); continue; }
      if (destNode && destNode.type === "dir"){
        if (!movePath(src, dest)) err("mv: cannot move " + tilde(src) + " in there");
      } else {
        if (!node(dirName(dest))){ err("mv: no such directory"); continue; }
        const moved = movePath(src, dirName(dest));
        if (moved) renamePath(dirName(dest) + "/" + moved, baseName(dest));
        else err("mv: cannot move " + tilde(src));
      }
    }
    refreshFiles();
  };
  CMDS.cp = function(a){
    const rec = a.some(x => x === "-r" || x === "-R");
    const rest = a.filter(x => !x.startsWith("-"));
    if (rest.length < 2) return err("cp: needs a source and a destination");
    const dest = absPath(rest[rest.length - 1], cwd);
    const destNode = node(dest);
    for (const s of rest.slice(0, -1)){
      const src = absPath(s, cwd), n = node(src);
      if (!n){ err("cp: " + s + ": no such file or directory"); continue; }
      if (n.type === "dir" && !rec){ err("cp: " + s + ": is a directory (use -r)"); continue; }
      if (destNode && destNode.type === "dir") copyPath(src, dest);
      else {
        if (!node(dirName(dest))){ err("cp: no such directory"); continue; }
        const placed = copyPath(src, dirName(dest));
        if (placed) renamePath(dirName(dest) + "/" + placed, baseName(dest));
      }
    }
    refreshFiles();
  };
  CMDS.trash = function(a){

      const p = absPath(t, cwd);
      if (!node(p)){ err("trash: " + t + ": no such file or directory"); continue; }
      if (trashPath(p)) n++;
    }
    refreshFiles();
    if (n) line([[n + " item(s) moved to Trash", "t-dim"]]);

  CMDS.backup = function(){ downloadBackup(); line([["backup written to your downloads", "t-ok"]]); };
  CMDS.save = function(a){

  CMDS.unbox = async function(a, raw){

      block(
"unbox - bring music and pictures in from the open web\n\n" +

    const kind = /^image/.test(verb) ? "image" : "audio";

    if (found.length > 1)

    notify("Unboxed", baseName(at) + " is in " + tilde(dirName(at)) + ".", "\uD83D\uDCE6");

  CMDS.neofetch = function(){
    const art =
"      +---------+\n" +
"     /         /|\n" +
"    /         / |\n" +
"   +---------+  |\n" +

  CMDS.ll = CMDS.ls;

  function run(raw){
    const cmdline = raw.trim();
    const echoRow = el("div", "term-row");
    echoRow.append(el("span", "ps1-u", "box@boxos"), el("span", "ps1-s", ":"),
                   el("span", "ps1-p", tilde(cwd)), el("span", "ps1-s", "$ "), el("span", null, cmdline));
    out.appendChild(echoRow);
    if (!cmdline) return;
    hist.push(cmdline);
    hi = hist.length;
    const parts = cmdline.split(/\s+/), cmd = parts[0], args = parts.slice(1);
    const rest = cmdline.slice(cmd.length).trim();
    if (CMDS[cmd]){
      try { CMDS[cmd](args, rest); } catch (e){ err(cmd + ": " + e.message); }
    } else {

  inp.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === "Return"){
      const v = inp.value;
      inp.value = "";
      run(v);
      drawPs1();
      scroll();
    } else if (e.key === "ArrowUp"){
      e.preventDefault();
      if (hi > 0){ hi--; inp.value = hist[hi] || ""; setTimeout(() => inp.setSelectionRange(999, 999), 0); }
    } else if (e.key === "ArrowDown"){
      e.preventDefault();
      if (hi < hist.length - 1){ hi++; inp.value = hist[hi] || ""; }
      else { hi = hist.length; inp.value = ""; }
    } else if (e.key === "Tab"){
      e.preventDefault();
      const value = inp.value;
      const parts = value.split(/\s+/);
      const word = parts[parts.length - 1] || "";
      let options, replaceFrom = word;

      if (parts.length <= 1){
        options = Object.keys(CMDS).filter(c => c.startsWith(word)).sort();
      } else {
        /* complete a path: split off the directory the user already typed */
        const slash = word.lastIndexOf("/");
        const dirPart = slash >= 0 ? word.slice(0, slash + 1) : "";
        const stem = slash >= 0 ? word.slice(slash + 1) : word;
        const dir = node(absPath(dirPart || ".", cwd));

        options = listDir(dir)
          .filter(nm => nm.toLowerCase().startsWith(stem.toLowerCase()))
          .map(nm => dirPart + nm + (dir.children[nm].type === "dir" ? "/" : ""));
        replaceFrom = word;
      }
      if (!options.length) return;

      /* one match completes, several fill in the shared prefix and list */
      let insert = options[0];
      if (options.length > 1){
        let prefix = options[0];
        for (const o of options) while (!o.startsWith(prefix)) prefix = prefix.slice(0, -1);
        insert = prefix.length >= replaceFrom.length ? prefix : replaceFrom;
        const row = el("div", "term-row");
        options.forEach(o => {
          const sp = el("span", o.endsWith("/") ? "t-dir" : null, o);
          sp.style.marginRight = "18px";
          row.appendChild(sp);
        });
        out.appendChild(row);
        scroll();
      }
      parts[parts.length - 1] = insert;
      inp.value = parts.join(" ") + (options.length === 1 && !insert.endsWith("/") ? " " : "");
      setTimeout(() => inp.setSelectionRange(999, 999), 0);
    } else if (e.key === "l" && e.ctrlKey){
      e.preventDefault();
      out.innerHTML = "";
    }
  });
  wrap.addEventListener("pointerdown", e => {
    if (!e.target.closest("input") && !getSelection().toString()) setTimeout(() => inp.focus(), 0);
  });

  const motd = node("/etc/motd");

  drawPs1();
  setTimeout(() => inp.focus(), 30);
  return {
    focusInput: () => inp.focus(),

      return {

          { label: "New Terminal", run: () => launch("terminal") },

/* ============================================================
   12. Image viewer
   ============================================================ */
function viewerApp(win, path){
  const n = node(path), B = win.body;
  const video = isVideo(baseName(path));
  B.innerHTML =
    '<div class="vw-stage fit">' + (video
      ? '<video controls autoplay loop playsinline></video>'
      : '<img alt="">') + '</div>' +
    '<div class="vw-bar"><span class="vw-info"></span><span style="flex:1"></span>' +
    (video ? '<button class="tb-btn" data-v="wall">Set as wallpaper</button>' +
             '<button class="tb-btn" data-v="boot">Set as boot screen</button>'
           : '<button class="tb-btn" data-v="wall">Set as wallpaper</button>') +
    '<button class="tb-btn" data-v="save">Save to computer</button>' +
    '<button class="tb-btn" data-v="fit">Fit</button><button class="tb-btn" data-v="full">100%</button></div>';
  const stage = $(".vw-stage", B), info = $(".vw-info", B);
  const media = $(video ? "video" : "img", B);
  if (!n || n.type !== "file"){ info.textContent = "File not found."; return {}; }
  media.src = n.content;
  const size = fmtBytes(nodeSize(n));
  if (video){
    media.onloadedmetadata = () => {
      info.textContent = baseName(path) + " \u00b7 " + media.videoWidth + "x" + media.videoHeight +
        " \u00b7 " + Math.round(media.duration) + "s \u00b7 " + size;
    };
    media.onerror = () => { info.textContent = baseName(path) + " \u00b7 this video cannot be played here"; };
    $('[data-v="boot"]', B).onclick = () => setBootFrom(path);
  } else {
    media.onload = () => { info.textContent = baseName(path) + " \u00b7 " + media.naturalWidth + "x" + media.naturalHeight + " \u00b7 " + size; };
    media.onerror = () => { info.textContent = baseName(path) + " \u00b7 could not be displayed"; };
  }
  $('[data-v="wall"]', B).onclick = () => setWallpaperFrom(path);
  $('[data-v="save"]', B).onclick = () => saveToComputer(path);
  $('[data-v="fit"]',  B).onclick = () => stage.classList.add("fit");
  $('[data-v="full"]', B).onclick = () => stage.classList.remove("fit");
  return { onClose(){ if (video){ media.pause(); media.removeAttribute("src"); } return true; } };
}

function paintApp(win){
  const B = win.body;
  B.innerHTML =
    '<div class="pt-tb">' +
      '<div class="pt-swatches"></div>' +
      '<span class="pt-sep"></span>' +
      '<div class="seg pt-sizes"></div>' +
      '<button class="tb-btn" data-p="erase" title="Eraser">Eraser</button>' +
      '<span class="ed-sp"></span>' +
      '<button class="tb-btn" data-p="clear">Clear</button>' +
      '<button class="tb-btn accent" data-p="save">Save to Pictures</button>' +
    '</div>' +
    '<div class="pt-stage"><canvas></canvas></div>' +
    '<div class="pt-status"></div>';

  const cv = $("canvas", B), ctx = cv.getContext("2d");
  const stage = $(".pt-stage", B), status = $(".pt-status", B);
  let color = "#1e1e1e", size = 4, erasing = false, drawing = false, last = null, dirty = false;

  function fit(){
    const w = Math.max(200, stage.clientWidth - 24), h = Math.max(160, stage.clientHeight - 24);
    if (cv.width === w && cv.height === h) return;
    const keep = cv.width ? ctx.getImageData(0, 0, cv.width, cv.height) : null;
    cv.width = w; cv.height = h;
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, w, h);
    if (keep) ctx.putImageData(keep, 0, 0);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
  }
  const swatches = $(".pt-swatches", B);
  PAINT_COLORS.forEach(c => {
    const b = el("button", "pt-sw" + (c === color ? " on" : ""));
    b.style.background = c;
    b.onclick = () => {
      color = c; erasing = false;
      $$(".pt-sw", B).forEach(o => o.classList.toggle("on", o.style.background === b.style.background));
      $('[data-p="erase"]', B).classList.remove("on");
      say();
    };
    swatches.appendChild(b);
  });
  const sizes = $(".pt-sizes", B);
  [2, 4, 9, 18].forEach(n => {
    const b = el("button", n === size ? "on" : null, String(n));
    b.onclick = () => { size = n; $$("button", sizes).forEach(o => o.classList.toggle("on", o === b)); say(); };
    sizes.appendChild(b);
  });
  const eraseBtn = $('[data-p="erase"]', B);
  eraseBtn.onclick = () => { erasing = !erasing; eraseBtn.classList.toggle("on", erasing); say(); };
  $('[data-p="clear"]', B).onclick = async () => {
    if (dirty && !(await osConfirm("Clear canvas", "Throw away this drawing?", "Clear", true))) return;
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, cv.width, cv.height);
    dirty = false;
    say();
  };
  $('[data-p="save"]', B).onclick = async () => {
    const name = await osPrompt("Save drawing", "File name", "drawing.png");
    if (!name) return;
    const fname = /\.png$/i.test(name) ? name : name + ".png";
    ensureDir(HOME + "/Pictures");
    const saved = addUnique(HOME + "/Pictures", fname, cv.toDataURL("image/png"), "image", "image/png");
    dirty = false;
    say();
    notify("Drawing saved", "Pictures/" + saved, String.fromCodePoint(0x1F3A8));
    openImage(HOME + "/Pictures/" + saved);
  };

  const at = e => {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (cv.width / r.width), y: (e.clientY - r.top) * (cv.height / r.height) };
  };
  cv.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    e.preventDefault();
    cv.setPointerCapture(e.pointerId);
    drawing = true;
    last = at(e);
    stroke(last, last);
  });
  cv.addEventListener("pointermove", e => { if (!drawing) return; const p = at(e); stroke(last, p); last = p; });
  const stop = () => { if (drawing) say(); drawing = false; last = null; };
  cv.addEventListener("pointerup", stop);
  cv.addEventListener("pointercancel", stop);
  function stroke(a, b){
    ctx.strokeStyle = erasing ? "#ffffff" : color;
    ctx.lineWidth = erasing ? size * 2.5 : size;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    dirty = true;
  }
  function say(){
    status.textContent = (erasing ? "Eraser" : "Brush") + " - " + size + "px - " +
      cv.width + " x " + cv.height + (dirty ? " - unsaved" : "");
  }
  const ro = new ResizeObserver(() => { fit(); say(); });
  ro.observe(stage);
  setTimeout(() => { fit(); say(); }, 0);
  return { onClose(){ ro.disconnect(); return true; } };
}

/* ============================================================
   12c. Minesweeper
   ============================================================ */
const MINE_LEVELS = {
  easy:   { w: 9,  h: 9,  m: 10, label: "Easy" },
  medium: { w: 16, h: 16, m: 40, label: "Medium" },
  hard:   { w: 24, h: 16, m: 70, label: "Hard" }
};

function minesApp(win){
  const B = win.body;
  B.innerHTML =
    '<div class="ms-tb">' +
      '<div class="seg ms-levels"></div>' +
      '<span class="ed-sp"></span>' +
      '<div class="ms-stat"><span class="ms-flags">0</span> left</div>' +
      '<button class="tb-btn ms-face">Reset</button>' +
      '<div class="ms-stat"><span class="ms-time">0</span>s</div>' +
    '</div>' +
    '<div class="ms-stage"><div class="ms-grid"></div></div>';

  const grid = $(".ms-grid", B), flagsEl = $(".ms-flags", B), timeEl = $(".ms-time", B);
  let level = "easy", cells = [], W = 0, H = 0, M = 0;
  let started = false, over = false, t0 = 0, timer = 0, revealed = 0;

  const seg = $(".ms-levels", B);
  for (const id in MINE_LEVELS){
    const b = el("button", id === level ? "on" : null, MINE_LEVELS[id].label);
    b.onclick = () => { level = id; $$("button", seg).forEach(o => o.classList.toggle("on", o === b)); reset(); };
    seg.appendChild(b);
  }
  $(".ms-face", B).onclick = reset;

  const idx = (x, y) => y * W + x;
  function neighbours(x, y){
    const out = [];
    for (let dy = -1; dy <= 1; dy++)
      for (let dx = -1; dx <= 1; dx++){
        if (!dx && !dy) continue;
        const nx = x + dx, ny = y + dy;
        if (nx >= 0 && ny >= 0 && nx < W && ny < H) out.push(cells[idx(nx, ny)]);
      }
    return out;
  }
  function reset(){
    const L = MINE_LEVELS[level];
    W = L.w; H = L.h; M = L.m;
    started = over = false;
    revealed = 0;
    clearInterval(timer);
    timeEl.textContent = "0";
    flagsEl.textContent = String(M);
    cells = [];
    grid.innerHTML = "";
    grid.style.gridTemplateColumns = "repeat(" + W + ", 22px)";
    for (let y = 0; y < H; y++)
      for (let x = 0; x < W; x++){
        const b = el("button", "ms-cell");
        const c = { x, y, el: b, mine: false, open: false, flag: false, n: 0 };
        b.onclick = () => open(c);
        b.oncontextmenu = e => { e.preventDefault(); e.stopPropagation(); flag(c); };
        cells.push(c);
        grid.appendChild(b);
      }
    $(".ms-face", B).textContent = "Reset";
    win.setTitle("Minesweeper");
  }
  function layMines(safe){
    const pool = cells.filter(c => c !== safe && !neighbours(safe.x, safe.y).includes(c));
    for (let i = 0; i < M && pool.length; i++){
      const k = Math.floor(Math.random() * pool.length);
      pool[k].mine = true;
      pool.splice(k, 1);
    }
    for (const c of cells) c.n = neighbours(c.x, c.y).filter(o => o.mine).length;
  }
  function open(c){
    if (over || c.open || c.flag) return;
    if (!started){
      started = true;
      layMines(c);
      t0 = Date.now();
      timer = setInterval(() => { timeEl.textContent = String(Math.floor((Date.now() - t0) / 1000)); }, 500);
    }
    if (c.mine) return boom(c);
    const stack = [c];
    while (stack.length){
      const cur = stack.pop();
      if (cur.open || cur.flag) continue;
      cur.open = true;
      revealed++;
      cur.el.classList.add("open");
      if (cur.n){ cur.el.textContent = String(cur.n); cur.el.dataset.n = String(cur.n); }
      else neighbours(cur.x, cur.y).forEach(o => { if (!o.open && !o.mine) stack.push(o); });
    }
    if (revealed === W * H - M) win_();
  }
  function flag(c){
    if (over || c.open) return;
    c.flag = !c.flag;
    c.el.classList.toggle("flag", c.flag);
    c.el.textContent = c.flag ? String.fromCodePoint(0x1F6A9) : "";
    flagsEl.textContent = String(M - cells.filter(o => o.flag).length);
  }
  function boom(c){
    over = true;
    clearInterval(timer);
    c.el.classList.add("boom");
    for (const o of cells){
      if (o.mine){ o.el.classList.add("open", "mine"); o.el.textContent = String.fromCodePoint(0x1F4A3); }
      else if (o.flag && !o.mine) o.el.textContent = String.fromCodePoint(0x274C);
    }
    $(".ms-face", B).textContent = "Try again";
    win.setTitle("Minesweeper - boom");
    notify("Minesweeper", "You hit a mine on " + MINE_LEVELS[level].label.toLowerCase() + ".", String.fromCodePoint(0x1F4A3));
  }
  function win_(){
    over = true;
    clearInterval(timer);
    const secs = Math.floor((Date.now() - t0) / 1000);
    for (const o of cells) if (o.mine && !o.flag){ o.el.classList.add("flag"); o.el.textContent = String.fromCodePoint(0x1F6A9); }
    $(".ms-face", B).textContent = "Play again";
    win.setTitle("Minesweeper - cleared");
    notify("Minesweeper cleared", MINE_LEVELS[level].label + " in " + secs + " seconds.", String.fromCodePoint(0x1F3C6));
  }
  reset();
  return { onClose(){ clearInterval(timer); return true; } };
}

/* ============================================================
   12d. Calculator
   ============================================================ */
function calcApp(win){
  const B = win.body;
  const keys = [["C","+/-","%","/"],["7","8","9","x"],["4","5","6","-"],["1","2","3","+"],["0",".","="]];
  B.innerHTML = '<div class="ca-out"><div class="ca-sub"></div><div class="ca-main">0</div></div><div class="ca-pad"></div>';
  const out = $(".ca-main", B), sub = $(".ca-sub", B), pad = $(".ca-pad", B);

  let acc = null, op = null, cur = "0", fresh = true;
  const show = () => {
    const n = parseFloat(cur);
    out.textContent = (cur.length > 12 && Number.isFinite(n)) ? String(+n.toPrecision(9)) : cur;
    sub.textContent = acc === null ? "" : acc + " " + (op || "");
  };
  function digit(d){
    if (fresh){ cur = d === "." ? "0." : d; fresh = false; }
    else if (d === "." && cur.includes(".")) return;
    else cur = cur === "0" && d !== "." ? d : cur + d;
    show();
  }
  const compute = (a, b, o) =>
    o === "+" ? a + b : o === "-" ? a - b : o === "x" ? a * b : o === "/" ? (b === 0 ? NaN : a / b) : b;
  function setOp(o){
    const v = parseFloat(cur);
    if (acc !== null && op && !fresh) acc = compute(acc, v, op);
    else acc = v;
    op = o;
    fresh = true;
    cur = String(acc);
    show();
    cur = String(acc);
  }
  function equals(){
    if (acc === null || !op) return;
    const r = compute(acc, parseFloat(cur), op);
    cur = Number.isFinite(r) ? String(+r.toFixed(10)) : "Cannot divide by zero";
    acc = null; op = null; fresh = true;
    show();
  }
  function press(k){
    if (/^[0-9.]$/.test(k)) return digit(k);
    if (k === "C"){ acc = null; op = null; cur = "0"; fresh = true; return show(); }
    if (k === "+/-"){ cur = String(parseFloat(cur) * -1); return show(); }
    if (k === "%"){ cur = String(parseFloat(cur) / 100); return show(); }
    if (k === "=") return equals();
    return setOp(k);
  }
  keys.forEach(rowKeys => {
    const row = el("div", "ca-row");
    rowKeys.forEach(k => {
      const b = el("button", "ca-key" + (/[+\-x\/=]/.test(k) && k.length === 1 ? " op" : "") + (k === "0" ? " wide" : ""), k);
      b.onclick = () => press(k);
      row.appendChild(b);
    });
    pad.appendChild(row);
  });
  B.tabIndex = 0;
  B.addEventListener("keydown", e => {
    const map = { Enter: "=", "*": "x", Escape: "C", Backspace: "C" };
    const k = map[e.key] || e.key;
    if (/^([0-9.]|[+\-x/=%]|C)$/.test(k)){ e.preventDefault(); press(k); }
  });
  setTimeout(() => B.focus(), 0);
  show();
  return {};
}

/* ============================================================
   12e. Trash - real, with restore
   ============================================================ */
function trashApp(win){
  const B = win.body;
  B.innerHTML =
    '<div class="fm-tb">' +
      '<span class="tr-count"></span><span class="ed-sp"></span>' +
      '<button class="tb-btn" data-t="restore" disabled>Put back</button>' +
      '<button class="tb-btn" data-t="del" disabled>Delete forever</button>' +
      '<button class="tb-btn" data-t="empty">Empty Trash</button>' +
    '</div>' +
    '<div class="fm-list"><table class="fm-tab">' +
      '<thead><tr><th>Name</th><th class="col-type">Was in</th><th class="col-size">Deleted</th></tr></thead><tbody></tbody>' +
    '</table></div>' +
    '<div class="fm-status"></div>';
  const tbody = $("tbody", B), status = $(".fm-status", B);
  let sel = null;

  function draw(){
    tbody.innerHTML = "";
    for (const t of Trash.items){
      const tr = el("tr");
      tr.dataset.id = t.id;
      const td = el("td", "col-name");
      td.append(el("span", "fi", nodeIcon(t.name, t.node)), document.createTextNode(t.name));
      tr.append(td, el("td", "col-type", tilde(t.from)), el("td", "col-size", fmtAgo(t.when)));
      if (t.id === sel) tr.classList.add("sel");
      tr.onclick = () => { sel = t.id; draw(); };
      tr.ondblclick = () => putBack(t.id);
      tbody.appendChild(tr);
    }
    if (!Trash.items.length){
      const tr = el("tr"), td = el("td", "fm-empty", "Trash is empty");
      td.colSpan = 3;
      tr.appendChild(td);
      tbody.appendChild(tr);
    }
    $(".tr-count", B).textContent = Trash.items.length + (Trash.items.length === 1 ? " item" : " items");
    $('[data-t="restore"]', B).disabled = !sel;
    $('[data-t="del"]', B).disabled = !sel;
    $('[data-t="empty"]', B).disabled = !Trash.items.length;
    status.textContent = Trash.items.length
      ? Trash.items.length + " item(s) \u00b7 " + fmtBytes(trashBytes()) + " \u00b7 double-click to put something back"
      : "Nothing here. Deleted files land in Trash until you empty it.";
    win.setTitle("Trash" + (Trash.items.length ? " (" + Trash.items.length + ")" : ""));
  }
  function putBack(id){
    const to = restoreTrash(id);
    sel = null;
    draw();
    refreshFilesViews();
    if (to) notify("Put back", tilde(to), "\u21A9\uFE0F");
  }
  $('[data-t="restore"]', B).onclick = () => sel && putBack(sel);
  $('[data-t="del"]', B).onclick = async () => {
    const t = Trash.items.find(x => x.id === sel);
    if (!t) return;
    if (!(await osConfirm("Delete forever", "Permanently delete " + t.name + "?", "Delete forever", true))) return;
    Trash.items = Trash.items.filter(x => x.id !== sel);
    sel = null;
    saveTrash();
    draw();
  };
  $('[data-t="empty"]', B).onclick = async () => {
    if (!Trash.items.length) return;
    if (!(await osConfirm("Empty Trash", "Permanently delete all " + Trash.items.length + " item(s)?\n\nThis cannot be undone.", "Empty Trash", true))) return;
    emptyTrash();
    sel = null;
    draw();
  };
  draw();
  return { refresh: draw };
}

/* ============================================================
   12f. Music - plays audio straight out of the filesystem
   ============================================================ */
function openAudio(path){
  for (const w of windows.values())
    if (w.appId === "music"){ focusWin(w); w.api.play(path); return w; }
  return launch("music", path);
}
function musicApp(win, startPath, only){
  const B = win.body;
  B.innerHTML =
    '<video class="mu-video" playsinline></video>' +
    '<div class="mu-now">' +
      '<div class="mu-art">\uD83C\uDFB5</div>' +
      '<div class="mu-meta"><div class="mu-title">Nothing playing</div><div class="mu-sub">Pick a track below</div></div>' +
    '</div>' +
    '<div class="mu-controls">' +
      '<button class="tb-btn" data-m="prev" title="Previous">&#9198;</button>' +
      '<button class="tb-btn accent" data-m="play" title="Play or pause">&#9654;</button>' +
      '<button class="tb-btn" data-m="next" title="Next">&#9197;</button>' +
      '<input class="mu-seek" type="range" min="0" max="1000" value="0">' +
      '<span class="mu-time">0:00</span>' +
      '<input class="mu-vol" type="range" min="0" max="100" value="90" title="Volume">' +
    '</div>' +
    '<div class="mu-list"></div>';

  const audio = new Audio();
  const video = $(".mu-video", B);
  let media = audio;                 /* whichever element is currently playing */
  const listEl = $(".mu-list", B), seek = $(".mu-seek", B), timeEl = $(".mu-time", B);
  const playBtn = $('[data-m="play"]', B);
  let tracks = [], at = -1, seeking = false;

  const fmtTime = s => {
    if (!Number.isFinite(s)) return "0:00";
    return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
  };
  function scan(){
    tracks = [];
    walkFS((p, n, name) => {
      if (n.type !== "file") return;
      const v = isVideo(name), a = isAudio(name);
      if (only === "video" ? v : only === "audio" ? a : (v || a)) tracks.push(p);
    });
    drawList();
  }
  function drawList(){
    listEl.innerHTML = "";
    if (!tracks.length){
      listEl.appendChild(el("div", "wb-none", only === "video"
        ? "No videos yet. Drop an .mp4 into the repo's videos/ folder, or import one in Files."
        : "Nothing to play yet. Import a file in Files, or add one to the repo's music/ folder."));
      return;
    }
    tracks.forEach((p, i) => {
      const b = el("button", "mu-row" + (i === at ? " on" : ""));
      b.append(el("span", "g", (i === at && !media.paused) ? "\u25B6" : (isVideo(baseName(p)) ? "\uD83C\uDFAC" : "\uD83C\uDFB5")),
               el("span", "mu-n", baseName(p)),
               el("span", "mu-d", tilde(dirName(p))));
      b.onclick = () => playIndex(i);
      listEl.appendChild(b);
    });
  }
  function playIndex(i){
    if (i < 0 || i >= tracks.length) return;
    at = i;
    const p = tracks[i], n = node(p);
    if (!n) return scan();
    const asVideo = isVideo(baseName(p));
    B.classList.toggle("showing-video", asVideo);
    audio.pause(); video.pause();
    const now = asVideo ? video : audio;
    const other = asVideo ? audio : video;
    try { other.removeAttribute("src"); other.load(); } catch (e){}
    media = now;
    now.src = n.content;
    now.play().catch(() => {});
    $(".mu-title", B).textContent = baseName(p);
    $(".mu-sub", B).textContent = tilde(dirName(p));
    win.setTitle(baseName(p));
    drawList();
  }
  function play(path){
    scan();
    const i = tracks.indexOf(path);
    if (i >= 0) playIndex(i);
  }
  playBtn.onclick = () => {
    if (!tracks.length) return;
    if (at < 0) return playIndex(0);
    media.paused ? media.play().catch(() => {}) : media.pause();
  };
  $('[data-m="next"]', B).onclick = () => { if (tracks.length) playIndex((at + 1) % tracks.length); };
  $('[data-m="prev"]', B).onclick = () => { if (tracks.length) playIndex((at - 1 + tracks.length) % tracks.length); };
  for (const m of [audio, video]){
    m.onplay = m.onpause = () => {
      if (m !== media) return;
      playBtn.innerHTML = m.paused ? "&#9654;" : "&#10074;&#10074;";
      drawList();
    };
    m.onended = () => { if (m === media && at + 1 < tracks.length) playIndex(at + 1); };
    m.ontimeupdate = () => {
      if (m !== media || seeking || !m.duration) return;
      seek.value = String(Math.round(m.currentTime / m.duration * 1000));
      timeEl.textContent = fmtTime(m.currentTime) + " / " + fmtTime(m.duration);
    };
    m.onerror = () => {
      if (m !== media) return;
      $(".mu-sub", B).textContent = "That file could not be played.";
    };
    m.volume = 0.9;
  }
  seek.oninput = () => { seeking = true; };
  seek.onchange = () => {
    if (media.duration) media.currentTime = seek.value / 1000 * media.duration;
    seeking = false;
  };
  const vol = $(".mu-vol", B);
  vol.oninput = () => { audio.volume = video.volume = vol.value / 100; };

  scan();
  if (startPath) play(startPath);
  return {
    play,
    refresh: scan,
    menus(){
      return {
        File: [
          { label: "Open from Files…", run: async () => {
              const p = await pickFile({ title: "Play something", ok: "Play", start: HOME + "/Music",
                                         accept: nm => isAudio(nm) || isVideo(nm) });
              if (p) play(p);
            } },
          "-",
          { label: "Close Window", run: () => win.close() }
        ],
        View: [
          { label: "Rescan library", run: scan },
          { label: "Next", run: () => { if (tracks.length) playIndex((at + 1) % tracks.length); } },
          { label: "Previous", run: () => { if (tracks.length) playIndex((at - 1 + tracks.length) % tracks.length); } }
        ]
      };
    },
    onClose(){ audio.pause(); video.pause(); audio.src = ""; video.removeAttribute("src"); return true; }
  };
}

/* ============================================================
   12g. Chat - runs chat.html, which lives beside this file

   This one is first-party: it ships with BOX OS rather than being
   something you imported, so it gets same-origin privileges and can
   talk to Firebase normally. Files you import stay in an opaque-origin
   sandbox as before.
   ============================================================ */
function chatApp(win){
  const B = win.body;
  B.innerHTML = '<div class="chat-wrap"><div class="chat-loading">Opening chat\u2026</div></div>';
  const wrap = $(".chat-wrap", B);
  let settled = false;

  function missing(why){
    if (settled) return;
    settled = true;
    wrap.innerHTML = "";
    const p = el("div", "chat-missing");
    p.append(
      el("div", "chat-missing-g", "\uD83D\uDCAC"),
      el("h2", null, "chat.html is not here"),
      el("p", null, why || "Chat lives in its own file. Put chat.html in the same folder as BOX OS and open this again."),
      el("p", "wb-none", "On GitHub Pages that means committing chat.html next to index.html.")
    );
    const again = el("button", "btn primary", "Try again");
    again.onclick = () => { win.close(); launch("chat"); };
    p.appendChild(again);
    wrap.appendChild(p);
  }
  /* Paint the chat in the desktop's colours, and keep it in step with the
     theme. chat.html keeps its own palette when opened on its own. */
  function sendTheme(){
    const cs = getComputedStyle(document.documentElement);
    const v = n => cs.getPropertyValue(n).trim();
    const dark = State.theme === "dark";
    const frame = $(".chat-frame", B);
    if (!frame || !frame.contentWindow) return;
    frame.contentWindow.postMessage({ boxtheme: {
      bg: v("--bg"), panel: v("--surface"), panel2: v("--surface-2"),
      border: v("--border-soft"), accent: v("--accent"), accentInk: v("--accent-fg"),
      text: v("--text"), muted: v("--dim"),
      mine: v("--accent") + (dark ? "33" : "22"),
      theirs: v("--surface-2"), danger: "#c9534b"
    } }, "*");
  }
  const themeWatch = setInterval(() => {
    if (themeWatch.last !== State.theme + State.accent){
      themeWatch.last = State.theme + State.accent;
      sendTheme();
    }
  }, 600);

  function mount(html){
    wrap.innerHTML = "";
    const frame = el("iframe", "chat-frame");
    frame.title = "Chat";
    /* first-party: it ships with BOX OS, so it runs same-origin and can reach
       Firebase normally. HTML you import yourself stays sandboxed. */
    frame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-popups allow-modals");
    frame.addEventListener("load", () => {
      try {
        const d = frame.contentDocument;
        if (!d || !d.body || !d.body.children.length) return missing();
      } catch (e){ /* cross-origin means it genuinely loaded */ }
      settled = true;
      sendTheme();
      chatSeen();
    });
    /* Mounted from the copy we already fetched, so it is never a stale
       cached one and the browser only asks for the file once. */
    if (html) frame.srcdoc = html; else frame.src = "chat.html";
    wrap.appendChild(frame);
    setTimeout(() => { if (!settled) missing("chat.html did not finish loading."); }, 8000);
  }

  /* A 404 page still has content, so "is the document empty" is not enough -
     ask the server what it thinks first. On file:// fetch is blocked, and we
     fall back to the emptiness check, which does work there. */
  (async () => {
    try {
      const res = await fetch("chat.html", { cache: "no-store" });
      if (!res.ok) return missing("The folder next to BOX OS has no chat.html (the server returned " + res.status + ").");
      const text = await res.text();
      if (!/<html|<body|firebase/i.test(text)) return missing("chat.html is there but does not look like the chat page.");
      if (!settled) return mount(text);
    } catch (e){
      /* file:// or offline - let the frame try on its own */
    }
    if (!settled) mount();
  })();

  return {};
}
/* ============================================================
   12h. Text Editor - a standalone one, rather than only inside Files
   ============================================================ */
function editorApp(win, startPath){
  const B = win.body;
  B.innerHTML =
    '<div class="te-tb">' +
      '<button class="tb-btn" data-t="open">Open\u2026</button>' +
      '<button class="tb-btn" data-t="save">Save</button>' +
      '<button class="tb-btn" data-t="saveas">Save As\u2026</button>' +
      '<span class="te-name"></span><span class="ed-dot">&bull;</span>' +
      '<span class="ed-sp"></span>' +
      '<button class="tb-btn" data-t="find">Find</button>' +
      '<button class="tb-btn" data-t="wrap">Wrap</button>' +
    '</div>' +
    '<div class="te-find">' +
      '<input class="te-q" placeholder="Find" spellcheck="false">' +
      '<input class="te-r" placeholder="Replace with" spellcheck="false">' +
      '<button class="tb-btn" data-t="next">Next</button>' +
      '<button class="tb-btn" data-t="rep">Replace</button>' +
      '<button class="tb-btn" data-t="repall">All</button>' +
      '<span class="te-hits"></span>' +
      '<button class="tb-btn" data-t="closefind">&#10005;</button>' +
    '</div>' +
    '<textarea class="te-area" spellcheck="false" wrap="off"></textarea>' +
    '<div class="te-foot"><span class="te-pos"></span><span class="ed-sp"></span><span class="te-info"></span></div>';

  const area = $(".te-area", B), findBar = $(".te-find", B);
  const q = $(".te-q", B), rep = $(".te-r", B), hits = $(".te-hits", B);
  const nameEl = $(".te-name", B), posEl = $(".te-pos", B), infoEl = $(".te-info", B);
  const btn = k => $('[data-t="' + k + '"]', B);
  let path = null, saved = "", wrap = false;

  const dirty = () => area.value !== saved;
  function retitle(){
    const label = path ? baseName(path) : "Untitled";
    nameEl.textContent = label;
    nameEl.title = path || "not saved yet";
    B.classList.toggle("dirty", dirty());
    win.setTitle(label + (dirty() ? " \u2022" : ""));
  }
  function status(){
    const upto = area.value.slice(0, area.selectionStart);
    const line = upto.split("\n").length;
    const col = upto.length - upto.lastIndexOf("\n");
    posEl.textContent = "Line " + line + ", column " + col;
    infoEl.textContent = area.value.split("\n").length + " lines \u00b7 " +
      area.value.length + " chars" + (path ? " \u00b7 " + tilde(path) : "");
    retitle();
  }
  function load(p){
    const n = node(p);
    if (!n || n.type !== "file" || n.kind !== "text")
      return osAlert("Cannot open that", baseName(p) + " is not a text file.");
    path = p;
    area.value = n.content;
    saved = n.content;
    status();
    area.focus();
  }
  async function doOpen(){
    if (dirty() && !(await osConfirm("Unsaved changes", "Open another file and lose your changes?", "Discard", true))) return;
    const p = await pickFile({ title: "Open a file", ok: "Open", start: HOME + "/Documents",
                               accept: (nm, n) => n.kind === "text" });
    if (p) load(p);
  }
  function doSave(){
    if (!path) return doSaveAs();
    writeFile(path, area.value, "text");
    saved = area.value;
    status();
    refreshFilesViews();
    notify("Saved", tilde(path), "\uD83D\uDCBE");
  }
  async function doSaveAs(){
    const name = await osPrompt("Save As", "File name", path ? baseName(path) : "untitled.txt");
    if (!name) return;
    const dir = path ? dirName(path) : HOME + "/Documents";
    ensureDir(dir);
    const final = addUnique(dir, name, area.value, "text", "text/plain");
    if (!final) return osAlert("Could not save", "That folder would not take the file.");
    path = dir + "/" + final;
    saved = area.value;
    status();
    refreshFilesViews();
    notify("Saved", tilde(path), "\uD83D\uDCBE");
  }

  /* find and replace, working off the live selection */
  function countHits(){
    const needle = q.value;
    if (!needle) return void (hits.textContent = "");
    let n = 0, i = area.value.toLowerCase().indexOf(needle.toLowerCase());
    while (i >= 0){ n++; i = area.value.toLowerCase().indexOf(needle.toLowerCase(), i + needle.length); }
    hits.textContent = n ? n + " found" : "none";
  }
  function findNext(){
    const needle = q.value;
    if (!needle) return;
    const hay = area.value.toLowerCase(), want = needle.toLowerCase();
    let from = area.selectionEnd;
    let i = hay.indexOf(want, from);
    if (i < 0) i = hay.indexOf(want);          /* wrap around */
    if (i < 0) return void (hits.textContent = "none");
    area.focus();
    area.setSelectionRange(i, i + needle.length);
    status();
  }
  function replaceOne(){
    const needle = q.value;
    if (!needle) return;
    const sel = area.value.slice(area.selectionStart, area.selectionEnd);
    if (sel.toLowerCase() === needle.toLowerCase()){
      const at = area.selectionStart;
      area.setRangeText(rep.value, at, area.selectionEnd, "end");
      status();
      countHits();
    }
    findNext();
  }
  function replaceAll(){
    const needle = q.value;
    if (!needle) return;
    /* walked by hand rather than with a regex, so the search text never has
       to be escaped and characters like . or ( behave literally */
    const want = needle.toLowerCase();
    let out = "", rest = area.value, n = 0;
    for (;;){
      const i = rest.toLowerCase().indexOf(want);
      if (i < 0){ out += rest; break; }
      out += rest.slice(0, i) + rep.value;
      rest = rest.slice(i + needle.length);
      n++;
    }
    if (!n) return void (hits.textContent = "none");
    area.value = out;
    status();
    countHits();
    notify("Replaced", n + " occurrence" + (n === 1 ? "" : "s") + " changed.", "\u270F\uFE0F");
  }
  function toggleFind(on){
    const show = on === undefined ? !findBar.classList.contains("on") : on;
    findBar.classList.toggle("on", show);
    if (show){ q.focus(); q.select(); countHits(); }
    else area.focus();
  }

  btn("open").onclick   = doOpen;
  btn("save").onclick   = doSave;
  btn("saveas").onclick = doSaveAs;
  btn("find").onclick   = () => toggleFind();
  btn("wrap").onclick   = () => {
    wrap = !wrap;
    area.wrap = wrap ? "soft" : "off";
    area.style.whiteSpace = wrap ? "pre-wrap" : "pre";
    btn("wrap").classList.toggle("on", wrap);
  };
  btn("next").onclick      = findNext;
  btn("rep").onclick       = replaceOne;
  btn("repall").onclick    = replaceAll;
  btn("closefind").onclick = () => toggleFind(false);
  q.oninput = countHits;
  q.onkeydown = e => { if (e.key === "Enter" || e.key === "Return"){ e.preventDefault(); findNext(); } };

  area.addEventListener("input", status);
  area.addEventListener("keyup", status);
  area.addEventListener("click", status);
  area.addEventListener("keydown", e => {
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === "s"){ e.preventDefault(); doSave(); }
    if (mod && e.key.toLowerCase() === "o"){ e.preventDefault(); doOpen(); }
    if (mod && e.key.toLowerCase() === "f"){ e.preventDefault(); toggleFind(true); }
    if (e.key === "Escape" && findBar.classList.contains("on")){ e.preventDefault(); toggleFind(false); }
    if (e.key === "Tab"){
      e.preventDefault();
      const a = area.selectionStart, b = area.selectionEnd;
      area.setRangeText("  ", a, b, "end");
      status();
    }
  });

  if (startPath) load(startPath); else status();
  setTimeout(() => area.focus(), 30);

  return {
    open: load,
    menus(){
      return {
        File: [
          { label: "New", run: async () => {
              if (dirty() && !(await osConfirm("Unsaved changes", "Start a new file and lose your changes?", "Discard", true))) return;
              path = null; area.value = ""; saved = ""; status();
            } },
          { label: "Open\u2026", run: doOpen },
          "-",
          { label: "Save", run: doSave, disabled: !dirty() && !!path },
          { label: "Save As\u2026", run: doSaveAs },
          { label: "Save to computer", run: () => path ? saveToComputer(path) : doSaveAs(), disabled: dirty() },
          "-",
          { label: "Close Window", run: () => win.close() }
        ],
        Edit: [
          { label: "Undo", run: () => { area.focus(); document.execCommand("undo"); status(); } },
          { label: "Redo", run: () => { area.focus(); document.execCommand("redo"); status(); } },
          "-",
          { label: "Find and replace", run: () => toggleFind(true) },
          { label: "Select All", run: () => { area.focus(); area.select(); } }
        ],
        View: [
          { label: (wrap ? "Stop wrapping" : "Wrap long lines"), run: () => btn("wrap").click() }
        ]
      };
    },
    onClose(){
      if (!dirty()) return true;
      osConfirm("Unsaved changes", (path ? baseName(path) : "This file") +
                " has unsaved changes.\n\nClose and lose them?", "Discard", true)
        .then(ok => { if (ok){ saved = area.value; win.close(); } });
      return false;
    }
  };
}

/* ---- unread chat, and telling you about it ---- */
const Chat = { unread: 0 };

function chatWindowLive(){
  for (const w of windows.values())
    if (w.appId === "chat" && !w.min && activeWin === w) return true;
  return false;
}
function chatSeen(){
  if (!Chat.unread) return;
  Chat.unread = 0;
  drawDock();
  for (const w of windows.values()) if (w.appId === "chat") w.setTitle("Chat");
}
addEventListener("message", e => {
  const d = e.data;
  if (!d || d.boxchat !== "message") return;
  /* only trust a frame we actually opened */
  let ours = false;
  for (const w of windows.values()){
    const f = w.appId === "chat" && w.body.querySelector(".chat-frame");
    if (f && f.contentWindow === e.source) ours = true;
  }
  if (!ours) return;

  if (chatWindowLive()) return;          /* you are already reading it */
  Chat.unread++;
  drawDock();
  for (const w of windows.values())
    if (w.appId === "chat") w.setTitle("Chat (" + Chat.unread + ")");
  const text = String(d.text || "");
  notify(d.from + " in #" + (d.channel || "chat"),
         text.length > 140 ? text.slice(0, 140) + "\u2026" : text,
         "\uD83D\uDCAC");
});

function applyTheme(){

  $("#traytheme").textContent = State.theme === "dark" ? "\u2600\uFE0F" : "\uD83C\uDF19";
  $("#traytheme").title = State.theme === "dark" ? "Switch to light" : "Switch to dark";
}
function applyAccent(){
  document.documentElement.style.setProperty("--accent", State.accent);
  document.documentElement.style.setProperty("--sel", State.accent);
  saveSettings();

function applyWallpaper(){
  const w = $("#wallpaper"), v = $("#wallvideo");
  document.documentElement.style.setProperty("--wall", State.wallColor);

  /* your own choice first, then anything sitting beside box-os.html */
  const chosen = mediaSource(State.wallVideo);
  const src = chosen ? chosen.content
            : (!State.customWall && Sibling.wall && Sibling.wall.video) ? Sibling.wall.url
            : null;
  if (src){
    if (v.dataset.src !== src){
      v.src = src;
      v.dataset.src = src;
    }
    v.style.objectFit = State.wallFit === "tile" ? "cover" : State.wallFit;
    v.classList.add("on");
    const go = v.play();
    if (go && go.catch) go.catch(() => {});
  } else {
    v.classList.remove("on");
    if (v.dataset.src){
      v.pause();
      v.removeAttribute("src");
      v.load();
      delete v.dataset.src;
    }
  }
  /* a path that no longer resolves should not leave the setting dangling */
  if (State.wallVideo && !chosen) State.wallVideo = null;

  const still = State.customWall ? State.customWall
              : (!src && Sibling.wall && !Sibling.wall.video) ? Sibling.wall.url
              : null;
  if (still){
    w.style.backgroundImage = "url(" + still + ")";
    w.style.backgroundRepeat = State.wallFit === "tile" ? "repeat" : "no-repeat";
    w.style.backgroundSize = State.wallFit === "tile" ? "auto" : State.wallFit;
  } else {
    w.style.backgroundImage = "";
  }
  saveSettings();
}
/* Chrome parks silent video when the tab is not being drawn ("video-only
   background media was paused to save power"), and does not always restart

  const v = $("#wallvideo");
  if (!v || !v.classList.contains("on") || !v.paused) return;
  const go = v.play();
  if (go && go.catch) go.catch(() => {});
}

/* the theme change: no sweep, no overlay - every surface just eases from one
   palette to the other in place. The tray icon still spins. */
function setTheme(next, originEl){
  if (next === State.theme) return;
  if (originEl){
    originEl.classList.remove("spin");
    void originEl.offsetWidth;          /* restart the animation */
    originEl.classList.add("spin");
    setTimeout(() => originEl.classList.remove("spin"), 620);
  }
  const root = document.documentElement;
  if (State.animations){
    root.classList.add("theming");
    setTimeout(() => root.classList.remove("theming"), 340);
  }
  State.theme = next;
  applyTheme();
  saveSettings();
  refreshSettings();
}
function toggleTheme(originEl){ setTheme(State.theme === "dark" ? "light" : "dark", originEl || $("#traytheme")); }
function restartMessage(){

    ? "Reload BOX OS?\n\nYour saved files, settings and shortcuts will still be here."
    : "Reload BOX OS?\n\nSaving is off, so everything in the filesystem will be lost.";

/* ============================================================
   13b. desktop environments

   A shell is mostly CSS. The parts that cannot be done in CSS - where the
   clock lives, and a dock of app launchers instead of a window list - are
   handled here. Adding another shell means a CSS block and a case below.
   ============================================================ */
const SHELLS = {
  mint:  { name: "Mint",   desc: "Panel along the bottom, window list, menu button" },
  macos: { name: "macOS",  desc: "Menu bar on top, dock at the bottom, traffic lights" }
};

function applyShell(){
  const shell = SHELLS[State.shell] ? State.shell : "mint";
  for (const id in SHELLS) document.body.classList.toggle("shell-" + id, id === shell);

  const tray = $("#tray"), panel = $("#panel"), menubar = $("#menubar");
  if (shell === "macos"){
    /* the clock and status icons belong in the menu bar */
    if (tray.parentElement !== menubar) menubar.appendChild(tray);
    $(".mb-logo", menubar).onclick = e => { e.stopPropagation(); menuOpen ? closeMenu() : openMenu(); };
  } else {
    if (tray.parentElement !== panel) panel.appendChild(tray);
  }
  drawDock();
  updateMenuBarApp();
}
/* the dock lists what you have pinned, plus anything running that is not */
function drawDock(){
  const dock = $("#dock");
  if (!dock) return;
  dock.innerHTML = "";
  if (State.shell !== "macos") return;

  const running = new Set(Array.from(windows.values()).map(w => w.appId));
  const pinned = (State.dock || []).filter(id => APPS[id] && !APPS[id].hidden);
  const extra = Array.from(running).filter(id => APPS[id] && !APPS[id].hidden && !pinned.includes(id));

  const add = (id, isPinned) => {
    const a = APPS[id];
    const b = el("button", "dock-app" + (running.has(id) ? " running" : ""));
    setAppIcon(b, a.icon);
    if (id === "chat" && Chat.unread){
      const badge = el("span", "dock-badge", Chat.unread > 99 ? "99+" : String(Chat.unread));
      b.appendChild(badge);
    }
    b.title = a.name + (id === "chat" && Chat.unread ? " - " + Chat.unread + " unread" : "");
    b.dataset.app = id;
    b.onclick = () => {
      const mine = Array.from(windows.values()).filter(w => w.appId === id);
      if (!mine.length) return launch(id);
      const hidden = mine.find(w => w.min);
      if (hidden) return focusWin(hidden);
      /* already looking at it? then put it away again */
      if (mine.includes(activeWin)) return minimizeWin(activeWin);
      focusWin(mine[mine.length - 1]);
    };
    b.oncontextmenu = e => {
      e.preventDefault(); e.stopPropagation();
      const open = Array.from(windows.values()).filter(w => w.appId === id);
      showCtx(e.clientX, e.clientY, [
        { icon: "\u25B6", label: open.length ? "Show " + a.name : "Open " + a.name,
          run: () => open.length ? focusWin(open[open.length - 1]) : launch(id) },
        { icon: "\u2795", label: "New window", run: () => launch(id, null, true) },
        "-",
        isPinned
          ? { icon: "\u2716", label: "Remove from Dock", run: () => { State.dock = State.dock.filter(x => x !== id); saveSettings(); drawDock(); } }
          : { icon: "\uD83D\uDCCC", label: "Keep in Dock", run: () => { State.dock = (State.dock || []).concat(id); saveSettings(); drawDock(); } },
        { icon: "\u274C", label: open.length ? "Quit (" + open.length + " open)" : "Quit", disabled: !open.length,
          run: () => open.forEach(w => w.close()) }
      ]);
    };
    dock.appendChild(b);
  };
  pinned.forEach(id => add(id, true));
  if (extra.length){
    dock.appendChild(el("div", "dock-sep"));
    extra.forEach(id => add(id, false));
  }
  dock.appendChild(el("div", "dock-sep"));
  const t = el("button", "dock-app");
  setAppIcon(t, "\uD83D\uDDD1\uFE0F");
  t.title = "Trash" + (Trash.items.length ? " (" + Trash.items.length + ")" : "");
  t.onclick = () => launch("trash");
  dock.appendChild(t);

  if (dockIntroPending) runDockIntro();
}
/* an app icon may be an emoji or a piece of inline SVG */
function setAppIcon(elm, icon){
  if (typeof icon === "string" && icon.trim().startsWith("<svg")) elm.innerHTML = icon;
  else elm.textContent = icon;
}
/* boot: the dock slides up, then the icons hop in one after another */
let dockIntroPending = false;
function runDockIntro(){
  const panel = $("#panel"), dock = $("#dock");
  if (!panel || !dock || !dock.children.length) return;
  dockIntroPending = false;
  if (!State.animations || State.shell !== "macos") return;
  panel.classList.remove("dock-in");
  void panel.offsetWidth;
  panel.classList.add("dock-in");
  Array.from(dock.children).forEach((c, i) => {
    if (!c.classList.contains("dock-app")) return;
    c.style.animation = "none";
    void c.offsetWidth;
    c.style.animation = "dockHop .42s cubic-bezier(.3,1.5,.5,1) " + (260 + i * 55) + "ms both";
  });
  setTimeout(() => {
    panel.classList.remove("dock-in");
    Array.from(dock.children).forEach(c => { c.style.animation = ""; });
  }, 260 + dock.children.length * 55 + 500);
}

function updateMenuBarApp(){ drawMenuBar(); }
/* where a minimising window should fly to */
function taskTargetFor(w){
  if (State.shell === "macos"){
    const icon = $('#dock .dock-app[data-app="' + w.appId + '"]');
    if (icon) return icon;
  }
  return w.task;
}

/* ============================================================
   13c. the menu bar

   Menus come from whichever window has focus: an app returns a `menus`
   object from its run(), and anything it does not define falls back to a
   generic set that acts on the focused window.
   ============================================================ */
function genericMenus(w){
  const has = !!w;
  const tile = z => () => { if (w) applySnap(w, z); };
  return {
    File: [
      { label: "New Window", run: () => w && launch(w.appId) , disabled: !has },
      "-",
      { label: "Close Window", run: () => w && w.close(), disabled: !has }
    ],
    Edit: [
      { label: "Cut",   run: () => document.execCommand("cut") },
      { label: "Copy",  run: () => document.execCommand("copy") },
      { label: "Paste", run: () => document.execCommand("paste") },
      "-",
      { label: "Select All", run: () => document.execCommand("selectAll") }
    ],
    View: [
      { label: State.theme === "dark" ? "Light theme" : "Dark theme",
        run: () => toggleTheme($("#traytheme")) },
      "-",
      { label: "Mint desktop",  run: () => { State.shell = "mint";  applyChrome(); refreshSettings(); } },
      { label: "macOS desktop", run: () => { State.shell = "macos"; applyChrome(); refreshSettings(); } },
      "-",
      { label: "Settings\u2026", run: () => launch("settings") }
    ],
    Window: [
      { label: "Minimise", run: () => w && minimizeWin(w), disabled: !has },
      { label: "Zoom",     run: () => w && toggleMax(w),   disabled: !has },
      "-",
      { label: "Tile Left",  run: tile("left"),  disabled: !has },
      { label: "Tile Right", run: tile("right"), disabled: !has },
      { label: "Full",       run: tile("max"),   disabled: !has },
      "-",
      { label: "Show Desktop", run: () => $("#traydesk").click() }
    ]
  };
}
function currentMenus(){
  const w = activeWin;
  const base = genericMenus(w);
  const own = (w && w.api && typeof w.api.menus === "function") ? (w.api.menus() || {}) : {};
  const out = {};
  for (const k of ["File", "Edit", "View", "Window"]) out[k] = own[k] || base[k];
  return out;
}
function drawMenuBar(){
  const bar = $("#menubar");
  if (!bar) return;
  const app = activeWin && APPS[activeWin.appId];
  const nameEl = $(".mb-app", bar);
  if (nameEl) nameEl.textContent = app ? app.name : "BOX OS";

  const menus = currentMenus();
  Array.from(bar.querySelectorAll(".mb-item")).forEach(n => n.remove());
  const sp = $(".mb-sp", bar);
  for (const label of ["File", "Edit", "View", "Window"]){
    const b = el("span", "mb-item", label);
    b.tabIndex = 0;
    b.onclick = e => {
      e.stopPropagation();
      const r = b.getBoundingClientRect();
      showCtx(r.left, r.bottom + 2, menus[label]);
    };
    bar.insertBefore(b, sp);
  }
}

/* ============================================================
   14. Settings
   ============================================================ */
function settingsApp(win){
  const B = win.body;

  /* small builders so the sections below stay readable */
  function section(title){
    const s = el("div", "set-sec");
    s.appendChild(el("h3", "set-h", title));
    return s;
  }
  function row(label){
    const r = el("div", "set-row");
    if (label != null) r.appendChild(el("span", "set-lab", label));
    return r;
  }
  function seg(options, value, onPick){
    const g = el("div", "seg");
    for (const [v, label] of options){
      const b = el("button", v === value ? "on" : null, label);
      b.onclick = () => onPick(v);
      g.appendChild(b);
    }
    return g;
  }
  function toggle(title, sub, value, onPick, badge){
    const r = el("div", "set-row");
    const lab = el("div", "sw-lab");
    lab.appendChild(document.createTextNode(title));
    if (badge) lab.appendChild(el("span", "badge", badge));
    if (sub) lab.appendChild(el("small", null, sub));
    const sw = el("div", "switch" + (value ? " on" : ""));
    sw.appendChild(el("i"));
    sw.onclick = () => onPick(!value);
    r.append(lab, sw);
    return r;
  }

  function render(){
    B.innerHTML = "";

    /* --- appearance --- */
    const a = section("Appearance");
    const themeRow = row("Theme");
    themeRow.appendChild(seg([["light", "Light"], ["dark", "Dark"]], State.theme, v => setTheme(v, $("#traytheme"))));
    a.appendChild(themeRow);

    const accRow = row("Accent");
    const sw = el("div", "swatches");
    for (const c of ACCENTS){
      const s = el("button", "sw" + (c.toLowerCase() === State.accent.toLowerCase() ? " on" : ""));
      s.style.background = c;
      s.title = c;
      s.onclick = () => { State.accent = c; applyAccent(); render(); };
      sw.appendChild(s);
    }
    const custom = el("input", "colorin");
    custom.type = "color";
    custom.value = State.accent;
    custom.title = "Custom accent colour";
    custom.oninput = () => { State.accent = custom.value; applyAccent(); };
    accRow.append(sw, custom);
    a.appendChild(accRow);

    a.appendChild(toggle("Window animations", "Open, close and minimise effects", State.animations,
      v => { State.animations = v; applyChrome(); render(); }));
    a.appendChild(toggle("Sounds", "A chime at startup, and a note when something happens", State.sounds !== false,
      v => { State.sounds = v; saveSettings(); render(); if (v) Sfx.play("notify"); }));
    a.appendChild(toggle("Wobbly windows", "The effect is not right yet - left in so you can try it", State.wobbly,
      v => { State.wobbly = v; saveSettings(); render(); },
      "broken"));
    B.appendChild(a);

    /* --- desktop environment --- */
    const de = section("Desktop environment");
    const deGrid = el("div", "de-grid");
    for (const id in SHELLS){
      const card = el("button", "de-card" + (State.shell === id ? " on" : ""));
      const prev = el("div", "de-prev " + id);
      prev.innerHTML = id === "macos"
        ? '<span class="p-bar"></span><span class="p-win"><i></i><i></i><i></i></span><span class="p-dock"></span>'
        : '<span class="p-win mint"></span><span class="p-panel"></span>';
      card.append(prev, el("div", "de-n", SHELLS[id].name), el("div", "de-d", SHELLS[id].desc));
      card.onclick = () => { State.shell = id; applyChrome(); render(); };
      deGrid.appendChild(card);
    }
    de.appendChild(deGrid);
    de.appendChild(el("div", "store-note",
      "A Hyprland-style tiling shell is the next one planned."));
    B.appendChild(de);

    /* --- wallpaper --- */
    const wp = section("Wallpaper");
    const walls = el("div", "walls");
    for (const p of WALL_COLORS){

    const fromFiles = el("button", "btn", "From my files\u2026");
    fromFiles.onclick = async () => {
      const p = await pickFile({
        title: "Choose a wallpaper",

    d.appendChild(sizeRow);
    B.appendChild(d);

    /* --- panel --- */
    const p = section("Panel & clock");
    const posRow = row("Position");
    posRow.appendChild(seg([["bottom", "Bottom"], ["top", "Top"]], State.panelPos,
      v => { State.panelPos = v; applyChrome(); render(); }));
    p.appendChild(posRow);
    const fmtRow = row("Clock");

    p.appendChild(fmtRow);
    B.appendChild(p);

    /* --- browser --- */

    const engRow = row("Search with");
    const sel = el("select", "wb-eng");
    sel.style.maxWidth = "180px";
    for (const id in ENGINES){
      const o = el("option", null, ENGINES[id].name);

    }
    sel.value = State.engine;

    br.appendChild(engRow);
    const pxRow = row("Tide");
    const px = el("input", "modal-in");

    const pxTest = el("button", "btn", "Test");

    pxTest.onclick = async () => {
      State.proxyUrl = px.value.trim();
      saveSettings();
      pxTest.disabled = true;
      pxNote.textContent = "Checking\u2026";
      const r = await testProxy(State.proxyUrl);
      pxTest.disabled = false;
      pxNote.textContent = (r.ok ? "\u2713 " : "\u2717 ") + r.why;

    if (Store.on){

      const when = Store.lastSaved ? fmtAgo(Store.lastSaved) : "not yet";

    /* --- about --- */
    const ab = section("About this system");

    ];

    };

    dds = Array.from(dl.querySelectorAll("dd"));
    tick();

  let dds = [];
  function tick(){
    if (!dds.length || !B.isConnected) return;
    dds[1].textContent = fmtDuration(Date.now() - BOOT_TIME);
    dds[2].textContent = windows.size + " open";
    dds[3].textContent = countFiles() + " files";
    dds[4].textContent = State.shortcuts.length + " custom, " +
      BUILTIN_ICONS.filter(b => State.builtins[b.id]).length + " default";
    dds[5].textContent = innerWidth + " x " + innerHeight;
    dds[6].textContent = !Store.available ? "Unavailable in this browser"
      : Store.on ? "Saving to this browser"
      : "Volatile - everything resets on reload";
  }
  const timer = setInterval(tick, 1000);

  /* import a media file from the real computer, then hand back its VFS path */
  function chooseMedia(kind, then){
    const inp = $("#mediapicker");
    inp.value = "";
    inp.accept = kind === "video" ? "video/*" : "video/*,image/*";
    inp.onchange = async () => {
      const f = inp.files && inp.files[0];
      inp.onchange = null;
      if (!f) return;
      const dir = isVideo(f.name) ? HOME + "/Videos" : HOME + "/Pictures";
      const name = await importMediaFile(f, dir);
      if (!name) return osAlert("Could not read that", "The file could not be loaded.");
      then(dir + "/" + name);
      render();
    };
    inp.click();
  }

  function pickWallpaper(){
    const inp = $("#wallpicker");
    inp.value = "";
    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      inp.onchange = null;
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        State.customWall = r.result;
        applyWallpaper();
        render();
        notify("Wallpaper changed", f.name, "\uD83D\uDDBC\uFE0F");
      };
      r.readAsDataURL(f);
    };
    inp.click();
  }

  render();
  return { refresh: render, onClose(){ clearInterval(timer); return true; } };
}

/* ============================================================
   15. shell: menu, panel, clock, notification centre
   ============================================================ */
const menuEl = $("#menu"), menuBtn = $("#menubtn"), searchEl = $("#msearch"), appsEl = $("#mapps");
const npEl = $("#npanel"), clockBtn = $("#clockbtn");
let menuOpen = false, npOpen = false;

function drawMenu(filter){
  appsEl.innerHTML = "";
  const q = (filter || "").toLowerCase();
  const ids = Object.keys(APPS).filter(id => !APPS[id].hidden &&
    (!q || APPS[id].name.toLowerCase().includes(q) || APPS[id].desc.toLowerCase().includes(q) || id.includes(q)));

  /* a query searches the filesystem as well as the app list */
  const hits = [];
  if (q) walkFS((p, n, name) => {
    if (hits.length < 8 && name.toLowerCase().includes(q)) hits.push([p, n, name]);
  });

  if (!ids.length && !hits.length){
    appsEl.appendChild(el("div", "fm-empty", "Nothing matches that"));
    return;
  }
  ids.forEach((id, i) => {
    const a = APPS[id];
    const b = el("button", "mapp" + (i === 0 && q ? " hl" : ""));
    const txt = el("span");
    txt.append(el("div", "n", a.name), el("div", "d", a.desc));
    const gi = el("span", "g");
    setAppIcon(gi, a.icon);
    b.append(gi, txt);
    b.onclick = () => { closeMenu(); launch(id); };
    b.oncontextmenu = e => {
      e.preventDefault(); e.stopPropagation();
      showCtx(e.clientX, e.clientY, [
        { icon: a.icon, label: "Open " + a.name, run: () => { closeMenu(); launch(id); } },
        { icon: "\uD83D\uDCCC", label: "Add to Desktop", run: () => {
            closeMenu();
            if (State.shortcuts.some(s => s.kind === "app" && s.target === id))
              return notify("Already there", a.name + " is already on the desktop.", "\u2139\uFE0F");
            addShortcut({ kind: "app", target: id, icon: a.icon, label: a.name });
          } }
      ]);
    };
    appsEl.appendChild(b);
  });

  if (hits.length){
    const head = el("div", "side-h", "Files");
    head.style.padding = "10px 10px 3px";
    appsEl.appendChild(head);
    for (const [p, n, name] of hits){
      const b = el("button", "mapp" + (!ids.length && hits[0][0] === p ? " hl" : ""));
      const txt = el("span");
      txt.append(el("div", "n", name), el("div", "d", tilde(dirName(p))));
      b.append(el("span", "g", nodeIcon(name, n)), txt);
      b.onclick = () => { closeMenu(); openNode(p); };
      appsEl.appendChild(b);
    }
  }
}

function openMenu(){
  closeNp();
  menuOpen = true;
  menuEl.classList.remove("hidden");
  menuBtn.classList.add("on");
  searchEl.value = "";
  drawMenu("");
  setTimeout(() => searchEl.focus(), 0);
}
function closeMenu(){
  menuOpen = false;
  menuEl.classList.add("hidden");
  menuBtn.classList.remove("on");
}
function openNp(){
  closeMenu();
  npOpen = true;
  npEl.classList.remove("hidden");
  clockBtn.classList.add("on");
  clockBtn.classList.remove("unread");
  drawCalendar();
  drawNotifications();
  npTick();
}
function closeNp(){
  npOpen = false;
  npEl.classList.add("hidden");
  clockBtn.classList.remove("on");
}
function npTick(){
  if (!npOpen) return;
  const d = new Date();
  $("#np-time").textContent = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: !State.clock24 });
  $("#np-date").textContent = d.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric", year: "numeric" });
}
menuBtn.onclick = e => { e.stopPropagation(); menuOpen ? closeMenu() : openMenu(); };
clockBtn.onclick = e => { e.stopPropagation(); npOpen ? closeNp() : openNp(); };
menuEl.addEventListener("pointerdown", e => e.stopPropagation());
npEl.addEventListener("pointerdown", e => e.stopPropagation());
$("#np-clear").onclick = () => { State.notifications = []; drawNotifications(); };
searchEl.addEventListener("input", () => drawMenu(searchEl.value));
searchEl.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === "Return"){ const f = $(".mapp", appsEl); if (f) f.click(); }
  else if (e.key === "Escape") closeMenu();
});
$("#mset").onclick     = () => { closeMenu(); launch("settings"); };
$("#mterm").onclick    = () => { closeMenu(); launch("terminal"); };
$("#mrestart").onclick = async () => {
  closeMenu();
  if (await osConfirm("Restart", restartMessage(), "Restart", !Store.on)) location.reload();
};

document.addEventListener("pointerdown", e => {
  if (menuOpen && !e.target.closest("#menu") && !e.target.closest("#menubtn")) closeMenu();
  if (npOpen && !e.target.closest("#npanel") && !e.target.closest("#clockbtn")) closeNp();
  if (!e.target.closest("#ctx")) hideCtx();
  if (!e.target.closest(".dicon")) $$(".dicon").forEach(d => d.classList.remove("sel"));
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ hideCtx(); if (menuOpen) closeMenu(); if (npOpen) closeNp(); }

  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName || "") || e.target.isContentEditable;

  /* Ctrl+Alt+... : tile, launch, show desktop. Chosen over the Super key
     because Windows swallows that one before the page ever sees it. */
  if (e.ctrlKey && e.altKey && !e.shiftKey){
    const w = activeWin;
    const zone = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "max", ArrowDown: "bottom" }[e.key];
    if (zone && w){ e.preventDefault(); return applySnap(w, zone); }
    const k = (e.key || "").toLowerCase();
    if (k === "t"){ e.preventDefault(); return launch("terminal"); }
    if (k === "f"){ e.preventDefault(); return launch("files"); }
    if (k === "b"){ e.preventDefault(); return launch("browser"); }
    if (k === "d"){ e.preventDefault(); return $("#traydesk").click(); }
  }
  /* Alt+Tab cycles the open windows */
  if (e.altKey && e.key === "Tab"){
    e.preventDefault();
    const list = Array.from(windows.values()).filter(o => !o.min);
    if (list.length < 2) return;
    const i = list.indexOf(activeWin);
    focusWin(list[(i + (e.shiftKey ? -1 : 1) + list.length) % list.length]);
    return;
  }
  /* a bare Super press opens the menu, the way Mint does */
  if (e.key === "Meta" && !typing && !menuOpen){ e.preventDefault(); openMenu(); }
});
addEventListener("contextmenu", e => {
  if (e.target.closest(".win") || e.target.closest("#panel") ||
      e.target.closest("#menu") || e.target.closest("#npanel") || e.target.closest(".dicon")) return;
  e.preventDefault();
  showCtx(e.clientX, e.clientY, [
    { icon: "\uD83C\uDF10", label: "Open Browser",  run: () => launch("browser") },
    { icon: "\u2328\uFE0F", label: "Open Terminal", run: () => launch("terminal") },
    { icon: "\uD83D\uDCC1", label: "Open Files",    run: () => launch("files") },
    "-",
    { icon: "\uD83D\uDCCC", label: "New shortcut\u2026",   run: newShortcutDialog },
    { icon: "\uD83D\uDDBC\uFE0F", label: "Change wallpaper\u2026", run: () => launch("settings") },
    { icon: "\uD83C\uDF19", label: "Toggle theme",   run: () => toggleTheme($("#traytheme")) }
  ]);
});

$("#traytheme").onclick = e => { e.stopPropagation(); toggleTheme(e.currentTarget); };
$("#traydesk").onclick = () => {
  const anyVisible = Array.from(windows.values()).some(w => !w.min);
  for (const w of windows.values()) anyVisible ? minimizeWin(w) : restoreWin(w);
};

function clockTick(){
  const d = new Date();
  $("#clk-t").textContent = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: !State.clock24 });
  $("#clk-d").textContent = d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
  clockBtn.title = d.toLocaleString() + " \u2014 click for notifications";
  npTick();
}

/* ============================================================
   16. boot
   ============================================================ */
/* ============================================================
   16b. first run

   Shown when the browser holds nothing for BOX OS yet. Say yes to saving and
   it never appears again; decline and it returns next time, which is honest -
   without saving, every boot really is a first boot.
   ============================================================ */
async function firstRun(){
  const wantSaving = await modal({
    title: "Enable file saving?",
    message: "BOX OS can keep your files, settings and shortcuts in this browser, " +
             "so they are still here next time.\n\n" +
             "Leave it off and everything resets when you reload.",
    ok: "Enable saving",
    cancelText: "Not now"
  });
  if (wantSaving && Store.available) setSaving(true);
  else if (wantSaving && !Store.available)
    await osAlert("Not available", "This browser is blocking storage for local files, so saving cannot be turned on.");

  await modal({
    title: "One more thing",
    message: "Click the box in the top left to open a new app.",
    ok: "Got it",
    cancel: false
  });
}

(function boot(){
  /* a restored disk wins; otherwise lay down the demo files, once */
  const restored = loadState();
  if (!restored) seedDisk();
  applyTheme(); applyAccent(); applyWallpaper(); applyChrome();
  drawDesktop(); drawNotifications(); clockTick();
  siblingReady.then(() => { if (Sibling.wall) applyWallpaper(); });
  mountRepoMedia().then(n => {
    if (n) notify("Media loaded", n + " file" + (n === 1 ? "" : "s") + " from the repo are in Videos and Music.", "\uD83C\uDFAC");
  });
  setInterval(clockTick, 1000);

  const b = $("#boot"), bar = $("#bootbar");
  let done = false;
  let t = 0;
  const finish = () => {
    if (done) return;
    done = true;
    clearTimeout(t);
    const bv = $("#bootvideo");
    bv.pause();
    b.style.opacity = "0";
    setTimeout(() => b.remove(), 500);
    BOOT_TIME = Date.now();
    /* wait until the viewport actually has a size (embedded/hidden frames) */
    let fired = false, tries = 0;
    const open = () => {
      if (fired) return;
      fired = true;
      dockIntroPending = true;
      drawDock();
      launch("files");
      /* nothing stored for us yet means this is a fresh machine */
      if (!restored && !Store.on){
        setTimeout(firstRun, 900);
        return;
      }
      setTimeout(() => notify(restored ? "Welcome back" : "Welcome to BOX OS",
        restored
          ? "Your files and settings were restored from this browser."
          : "Right-click the desktop for a menu. Turn on saving in Settings to keep your files.",
        "\uD83D\uDCE6"), 700);
    };
    const poll = setInterval(() => {
      if ($("#windows").clientWidth > 200 || ++tries > 50){ clearInterval(poll); open(); }
    }, 60);
    if ($("#windows").clientWidth > 200){ clearInterval(poll); open(); }
  };

  /* a custom boot screen replaces the splash entirely */
  const chosenBoot = mediaSource(State.bootMedia);
  const startSplash = () => {
    requestAnimationFrame(() => { bar.style.width = "100%"; });
    t = setTimeout(finish, 1600);
  };
  if (!chosenBoot){
    /* nothing chosen: give the sibling probe a moment, showing the splash meanwhile */
    startSplash();
    Promise.race([siblingReady, new Promise(r => setTimeout(r, 1100))]).then(() => {
      if (done || !Sibling.boot) return;
      clearTimeout(t);
      showBootMedia(Sibling.boot.url, Sibling.boot.video);
    });
  } else {
    showBootMedia(chosenBoot.content, isVideo(baseName(State.bootMedia)));
  }

  function showBootMedia(src, video){
    b.classList.add("media");
    if (video){
      const bv = $("#bootvideo");
      bv.muted = true;               /* the property, not just the attribute - autoplay depends on it */
      bv.playsInline = true;
      bv.src = src;
      bv.classList.add("on");
      bv.onended = finish;
      bv.onerror = finish;
      /* Cap it either way: when the video plays we wait for it (up to 15s);
         when autoplay is refused we hold the first frame briefly instead of
         flashing past a frozen screen. */
      t = setTimeout(finish, 15000);
      const go = bv.play();
      if (go && go.catch) go.catch(err => {
        window.__bootPlayErr = err && (err.name + ": " + err.message);
        clearTimeout(t);
        t = setTimeout(finish, 2600);
      });
    } else {
      const bi = $("#bootimage");
      bi.src = src;
      bi.classList.add("on");
      bi.onerror = finish;
      t = setTimeout(finish, 2600);
    }
  }
  b.addEventListener("click", finish);
})();

</script>
